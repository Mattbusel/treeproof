name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: git identity for test fixtures
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo build --locked

  interop:
    name: reference implementations (securesystemslib, in-toto-attestation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked && echo "$PWD/target/release" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet securesystemslib in-toto-attestation cryptography
      - run: bash tests/ci/interop.sh

  real-runners:
    name: real runner output (cargo, nextest, pytest, xdist, go, jest, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m pip install --quiet pytest pytest-xdist
      - run: cargo build --release --locked && echo "$PWD/target/release" >> "$GITHUB_PATH"
      - run: bash tests/ci/real_runners.sh

  otel-collector:
    name: OTLP events into a real OpenTelemetry Collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked && echo "$PWD/target/release" >> "$GITHUB_PATH"
      - run: bash tests/ci/otel_collector.sh

  action:
    name: GitHub Action self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build treeproof
        shell: bash
        run: |
          cargo build --release --locked
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Make a fixture repository with a committed receipt
        shell: bash
        run: |
          set -euo pipefail
          fx="$RUNNER_TEMP/fixture"
          mkdir -p "$fx" && cd "$fx"
          git init -q -b main
          git config user.email ci@example.com && git config user.name ci
          cp "$GITHUB_WORKSPACE/tests/fixtures/run_tests.py" .
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          "$py" --version
          export TREEPROOF_KEY_FILE="$RUNNER_TEMP/dev.key" TREEPROOF_CACHE_DIR="$RUNNER_TEMP/devcache"
          treeproof run -- "$py" run_tests.py
          treeproof export
          git add -A && git commit -q -m "code + receipt"
          echo "FIXTURE=$fx" >> "$GITHUB_ENV"
      - name: Receipt verifies and reproduces
        uses: ./verify
        with:
          install: none
          working-directory: ${{ env.FIXTURE }}
      - name: Re-run disagrees with the receipt (must fail)
        id: mismatch
        continue-on-error: true
        uses: ./verify
        env:
          FAKE_FAIL: "1"
        with:
          install: none
          working-directory: ${{ env.FIXTURE }}
      - name: Tamper with the committed receipt
        shell: bash
        run: |
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          cd "$FIXTURE"
          "$py" "$GITHUB_WORKSPACE/tests/ci/tamper.py" .treeproof/receipts/*.json
      - name: Verify the tampered receipt (must fail)
        id: tampered
        continue-on-error: true
        uses: ./verify
        with:
          install: none
          rerun: "false"
          working-directory: ${{ env.FIXTURE }}
      - name: Check the must-fail cases failed
        shell: bash
        run: |
          echo "mismatch=${{ steps.mismatch.outcome }} tampered=${{ steps.tampered.outcome }}"
          test "${{ steps.mismatch.outcome }}" = failure
          test "${{ steps.tampered.outcome }}" = failure

  plugin:
    name: plugin manifests are valid JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          for f in plugin/.claude-plugin/plugin.json plugin/.codex-plugin/plugin.json plugin/hooks/hooks.json plugin/hooks/codex-hooks.json plugin/.mcp.json .claude-plugin/marketplace.json .agents/plugins/marketplace.json npm/package.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done
