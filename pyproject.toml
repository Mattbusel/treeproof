[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "treeproof"
dynamic = ["version"]
description = "Signed test-result receipts for a git tree (in-toto test-result), a cross-worktree result cache, and done-gates for coding agents."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
keywords = ["in-toto", "attestation", "testing", "agents", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Testing",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/Mattbusel/treeproof"
Repository = "https://github.com/Mattbusel/treeproof"
Specification = "https://github.com/Mattbusel/treeproof/blob/main/SPEC.md"

[tool.maturin]
bindings = "bin"
strip = true
